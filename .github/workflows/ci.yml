name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps: &check-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The published coverage includes the Unix and Windows code paths.
      - name: Install the pinned cargo-llvm-cov
        if: runner.os != 'macOS'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - name: Check the crate
        run: |
          rustup toolchain install
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          if [ "$RUNNER_OS" != macOS ]; then
            rustup component add llvm-tools
            cargo llvm-cov --locked --remap-path-prefix --lcov --output-path coverage.lcov
            if [ "$RUNNER_OS" = Windows ]; then
              sed -i '/^SF:/s|\\|/|g' coverage.lcov
            fi
            # cargo llvm-cov leaves out doctests.
            cargo test --doc --locked
          else
            cargo test --locked
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            # The fuzz target runs only on a schedule; check that it still builds.
            cargo check --locked --manifest-path fuzz/Cargo.toml
          fi
          cargo build --locked --release
      - name: Run the release build on the fixtures
        run: >-
          target/release/bigsister all --since 2026-11-01
          --claude-root tests/fixtures/claude --codex-root tests/fixtures/codex
      - name: Keep the coverage report for the Codecov upload
        if: runner.os != 'macOS' && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ runner.os == 'Linux' && 'coverage' || 'coverage-windows' }}
          path: coverage.lcov
          retention-days: 1

  # The upload runs apart from the tests, so the OIDC token is never available whilst
  # test code runs, and only for pushes to main: a pull request's workflow, a Dependabot
  # one included, could change what runs with the token before review.
  codecov:
    name: upload coverage to Codecov
    needs: [check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A Codecov outage must not fail the checks.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage*
          path: reports
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          version: v11.3.2
          files: reports/coverage/coverage.lcov,reports/coverage-windows/coverage.lcov
          disable_search: true
          fail_ci_if_error: true

  # The same steps on macOS, for pushes to main and manual runs only: the leg was
  # about 20 of every pull request's 25 weighted runner minutes and holds one of the
  # account's 5 shared macOS runners. A pull request shows it as skipped, which
  # counts as passed, so the required check still reports.
  check-macos:
    name: check (macos-latest)
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps: *check-steps

  # Each release target that no leg above tests, built and tested as release-policy's
  # release-binary.yml does at release.yml's pin: native runner, the musl C toolchain
  # for Linux, a static C runtime for Windows. Like the macOS leg, it runs for pushes
  # to main and manual runs only, so a break shows before a tag rather than at it.
  release-targets:
    name: test ${{ matrix.target }}
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the musl C toolchain
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Link the C runtime statically
        if: endsWith(matrix.target, '-windows-msvc')
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      - name: Test and build for the target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          cargo test --locked --target "$TARGET"
          cargo build --locked --release --target "$TARGET"
          "target/$TARGET/release/bigsister" --version
