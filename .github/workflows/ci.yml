name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps: &check-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Linux runs the tests with line coverage for the README's Codecov badge; a prebuilt
      # cargo-llvm-cov, with no fallback to compiling it.
      - name: Install the pinned cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - name: Check the crate
        run: |
          rustup toolchain install
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          if [ "$RUNNER_OS" = Linux ]; then
            rustup component add llvm-tools
            cargo llvm-cov --locked --lcov --output-path coverage.lcov
          else
            cargo test --locked
          fi
          cargo build --locked --release
      - name: Run the release build on the fixtures
        run: >-
          target/release/shaphan all --since 2026-11-01
          --claude-root tests/fixtures/claude --codex-root tests/fixtures/codex
      - name: Keep the coverage report for the Codecov upload
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.lcov
          retention-days: 1

  # The upload runs apart from the tests, so the OIDC token is never available whilst
  # test code runs, and only for this repository's own branches.
  codecov:
    name: upload coverage to Codecov
    needs: [check]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A Codecov outage must not fail the checks.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.lcov
          disable_search: true
          fail_ci_if_error: true

  # The same steps on macOS, for pushes to main and manual runs only: the leg was
  # about 20 of every pull request's 25 weighted runner minutes and holds one of the
  # account's 5 shared macOS runners. A pull request shows it as skipped, which
  # counts as passed, so the required check still reports.
  check-macos:
    name: check (macos-latest)
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps: *check-steps
