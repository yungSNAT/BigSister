name: VirusTotal report check (temporary)

# Reads the VirusTotal report of each listed release file and prints its SHA-256 and
# detection counts. Runs only on this branch, which is never merged.
on:
  push:
    branches: [ryan/virustotal-report-check-2026-11-23]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Read each report
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ ! $VT_API_KEY =~ ^[0-9a-f]{64}$ ]]; then
            echo "VT_API_KEY is not a 64-character lower-case hexadecimal key" >&2
            exit 1
          fi
          # Keep the key off curl's command line.
          printf 'header = "x-apikey: %s"\n' "$VT_API_KEY" > "$RUNNER_TEMP/vt.curl"
          trap 'rm -f "$RUNNER_TEMP/vt.curl"' EXIT
          while read -r sha; do
            [ -n "$sha" ] || continue
            code=$(curl --disable --proto '=https' --silent --config "$RUNNER_TEMP/vt.curl" \
              --output report.json --write-out '%{http_code}' \
              "https://www.virustotal.com/api/v3/files/$sha")
            if [ "$code" = 200 ]; then
              echo "REPORT $sha $(jq -c '.data.attributes | {sha256, stats: .last_analysis_stats, analysed: .last_analysis_date, size}' report.json)"
            else
              echo "REPORT $sha http=$code"
            fi
            # The public API allows 4 requests a minute.
            sleep 16
          done <<'HASHES'
          9777feb645f6dcb7ecb990670e0da5e0ebbc087be744d27818bbd7b344b0c3e0
          1658ed4311a2f373e90e60135e9f115a9d8d32c9b8fb9bf6a0b30152bdaeea02
          0573ae1be12e980541d5ee58bc06f2accc5a4a5fbfb50d76b75c085fe4ce1251
          1424bf00c7ce75280eaf88547543772a809d78ebbe566feeaadd2bde3cafe6ea
          006dfa144798a34ccb930b670c9a92ff8b8d364fb3bceb7cfba665e56c069496
          e20f73694fb5aa3829626a44bdd38111dadf0efd2159a25b0070086c38299867
          2de648764c1f9159a484d86de4aad021c677d5fb05243f7e39dfd7590e05138a
          HASHES
