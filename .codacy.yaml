# Opengrep does not scan the integration tests under tests/, where its
# temporary-folder rules flag fixtures; src/ is still scanned. Lizard's file-size
# check skips lockfiles, which Cargo generates.
engines:
  opengrep:
    exclude_paths:
      - "tests/**"
  lizard:
    exclude_paths:
      - "Cargo.lock"
      - "**/Cargo.lock"
