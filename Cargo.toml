[package]
name = "shaphansaudit"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Find where your coding agent's tokens go, from its own transcripts."
license = "FSL-1.1-ALv2"
publish = false

[[bin]]
name = "shaphan"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
jiff = { version = "1.0.0", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
regex = "1"
ruzstd = "0.9"
rusqlite = { version = "0.41.1", features = ["bundled", "hooks", "serialize"] }
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
csv = "1"

[lints.clippy]
ref_option = "warn"
too_many_lines = "warn"

[profile.release]
lto = true
codegen-units = 1
